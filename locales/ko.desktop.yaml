settings.gateway.intro: 기본값은 로컬입니다. 이 앱이 다른 곳의 Hermes 백엔드를 제어해야 할 때 원격을 사용하세요. 게이트웨이 연결은 기기 단위이며, 프로필은 연결한 게이트웨이에서 검색됩니다.
settings.gateway.keychainEncryptionDesc: 기본적으로 꺼져 있습니다. 켜면 게이트웨이 토큰과 로그인 인증 정보가 시스템 키체인(Keychain Access, GNOME Keyring 또는 Windows DPAPI)으로 암호화되며, 시스템이 권한이나 비밀번호를 요청할 수 있습니다. 끄면 내 사용자 계정만 읽을 수 있는 일반 파일로 저장됩니다.
