settings.fieldDescriptions.browser.useRealProfile: 로컬 브라우징에 실제 로그인 정보를 사용합니다. Hermes는 기본 브라우저의 프로필(쿠키, 로그인, 환경설정)을 관리되는 스냅샷으로 복사하여 내장 Chromium으로 구동합니다 — 실제 프로필은 직접 열지 않으며, 실행할 때마다 복사본을 새로 고칩니다. 클라우드 브라우저 백엔드가 구성된 경우에도 요청 시 에이전트가 로컬 실제 프로필 세션을 열 수 있습니다. Chromium 브라우저(Chrome, Edge, Brave, Brave Origin, Chromium)만 지원되며, 기본 브라우저가 Chromium이 아니면 명확한 메시지와 함께 실패합니다. 기본적으로 꺼져 있습니다.
settings.fieldDescriptions.checkpoints.enabled: 파일 편집 전에 롤백 스냅샷을 생성합니다.
settings.fieldDescriptions.codeExecution.mode: 코드 실행을 현재 프로젝트로 얼마나 엄격하게 제한할지 설정합니다.
