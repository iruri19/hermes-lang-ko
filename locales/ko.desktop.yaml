settings.fieldDescriptions.compression.enabled: 대화가 길어지면 오래된 컨텍스트를 요약합니다.
settings.fieldDescriptions.context.engine: 컨텍스트 한도에 가까운 긴 대화를 관리하는 전략입니다.
settings.fieldDescriptions.desktop.repoScanEnabled: 로컬 폴더에서 Git 저장소를 검색하여 프로젝트에 표시합니다.
settings.fieldDescriptions.desktop.repoScanExcludePaths: 저장소 검색 시 건너뛸 폴더 및 그 하위 폴더입니다.
settings.fieldDescriptions.desktop.repoScanRoots: 검색할 폴더입니다. 비워 두면 홈 디렉터리를 검색합니다.
settings.fieldDescriptions.display.personality: 새 세션의 기본 어시스턴트 스타일입니다.
settings.fieldDescriptions.display.showReasoning: 백엔드가 제공하는 경우 추론 섹션을 표시합니다.
settings.fieldDescriptions.fallbackProviders: 기본 모델이 실패할 경우 시도할 백업 provider:model 항목입니다.
settings.fieldDescriptions.fileReadMaxChars: Hermes가 한 번의 파일 요청으로 읽을 수 있는 최대 문자 수입니다.
settings.fieldDescriptions.memory.memoryEnabled: 향후 세션에 도움이 될 수 있는 영구 메모리를 저장합니다.
settings.fieldDescriptions.memory.userProfileEnabled: 사용자 선호도를 간결한 프로필로 유지합니다.
settings.fieldDescriptions.model: 입력창에서 다른 모델을 선택하지 않으면 새 채팅에 사용됩니다.
settings.fieldDescriptions.modelContextLength: 기본 채팅 모델의 감지된 컨텍스트 창(토큰)만 재정의합니다. 0으로 두면 선택한 모델의 감지된 값을 사용합니다. 보조/MoA 모델에는 영향을 주지 않습니다.
settings.fieldDescriptions.security.redactSecrets: 가능한 경우 모델에 보이는 내용에서 감지된 비밀 정보를 숨깁니다.
settings.fieldDescriptions.stt.echoTranscripts: 음성 메시지의 원본 🎙️ 대화 기록을 채팅에 다시 게시합니다.
settings.fieldDescriptions.stt.elevenlabs.languageCode: 선택적 ISO-639-3 언어 코드입니다. 비워 두면 ElevenLabs가 자동으로 감지합니다.
settings.fieldDescriptions.stt.enabled: 로컬 또는 제공자 기반 음성 받아쓰기를 사용합니다.
settings.fieldDescriptions.stt.streaming: 말하는 동안 텍스트를 표시합니다(OpenAI, xAI, ElevenLabs). 실패하면 녹음 방식으로 대체합니다.
settings.fieldDescriptions.terminal.cwd: 도구 및 터미널 작업에 사용할 기본 프로젝트 폴더입니다.
settings.fieldDescriptions.terminal.daytonaImage: 실행 백엔드가 Daytona일 때 사용하는 이미지입니다.
settings.fieldDescriptions.terminal.dockerImage: 실행 백엔드가 Docker일 때 사용하는 컨테이너 이미지입니다.
settings.fieldDescriptions.terminal.envPassthrough: 도구 실행에 전달할 환경 변수입니다.
settings.fieldDescriptions.terminal.modalImage: 실행 백엔드가 Modal일 때 사용하는 이미지입니다.
settings.fieldDescriptions.terminal.persistentShell: 'SSH 백엔드: 명령 간에 export한 변수를 유지합니다. 끄면 각 명령이 로그인 환경에서 시작되며, 작업 디렉터리는 항상 유지됩니다.'
settings.fieldDescriptions.terminal.singularityImage: 실행 백엔드가 Singularity일 때 사용하는 이미지입니다.
settings.fieldDescriptions.timezone: IANA 시간대 식별자입니다. 비워 두면 시스템 시간대를 사용합니다.
settings.fieldDescriptions.tts.neutts.device: NeuTTS의 로컬 추론 장치입니다.
settings.fieldDescriptions.tts.xai.autoSpeechTags: 합성 전에 LLM이 스크립트에 표현용 오디오 태그([laughing], [sighs])를 삽입하도록 합니다.
settings.fieldDescriptions.tts.xai.bitRate: MP3 비트레이트(bps)입니다. 코덱이 mp3일 때만 적용됩니다.
settings.fieldDescriptions.tts.xai.language: '음성 언어 코드(예: en, pt-BR) 또는 자동 감지를 위한 "auto"입니다.'
settings.fieldDescriptions.tts.xai.optimizeStreamingLatency: 지연 시간과 품질 간의 균형입니다. 0 = 최고 품질, 2 = 최저 지연 시간.
settings.fieldDescriptions.tts.xai.sampleRate: 오디오 샘플 레이트(Hz)입니다. 높을수록 품질이 좋고 파일이 커집니다.
settings.fieldDescriptions.tts.xai.speed: 재생 속도입니다. 0.7 = 느리게, 1.0 = 보통, 1.5 = 빠르게.
settings.fieldDescriptions.tts.xai.voiceId: 'xAI 음성 ID(예: eve) 또는 사용자 지정 음성 ID입니다.'
settings.fieldDescriptions.updates.nonInteractiveLocalChanges: Hermes가 앱에서 자체 업데이트할 때(터미널 프롬프트 없음) 로컬 소스 변경 사항을 보존(stash)하거나 버립니다(discard). 터미널 업데이트는 항상 확인합니다.
settings.fieldDescriptions.voice.autoTts: 어시스턴트 응답을 자동으로 읽어 줍니다.
settings.fieldDescriptions.voice.gptLive.instructions: 실시간 음성 페르소나를 위한 추가 문장(어조, 속도, 언어)입니다. Hermes는 자체 시스템 프롬프트를 유지합니다.
settings.fieldDescriptions.voice.gptLive.voice: GPT-Live 모드의 음성입니다. 사용자 지정 음성 ID도 사용할 수 있습니다.
settings.fieldDescriptions.voice.voiceChatMode: 'chained: 아래 제공자를 사용해 음성 인식 → Hermes → 음성 합성 순으로 처리합니다. gpt-live: 하나의 전이중 OpenAI 음성 모델(gpt-live-1)이 듣고 말하며, 모든 실제 요청을 Hermes에 넘깁니다 — 선택한 모델이 전체 도구 세트로 답변합니다. OpenAI API 키가 필요하며, 음성 계층은 분당 $0.05가 청구됩니다.'
